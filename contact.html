<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Greenroot Community Garden</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1">
    <div class="container">
      <a class="navbar-brand" href="index.html">Greenroot Garden</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-label="Open menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <dialog class="drawer" id="navbarDrawer">
        <div class="drawer-header">
          <p class="drawer-title mb-0">Menu</p>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close menu"></button>
        </div>
        <div class="drawer-body">
          <ul class="nav navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container mt-3">
    <h1>Contact Us</h1>

    <form style="max-width: 900px" class="mx-auto">
      <div class="row g-4">

        <div class="md:col-6">
          <div class="form-field">
            <label for="firstName" class="form-label">First name</label>
            <input type="text" class="form-control" id="firstName">
          </div>
        </div>

        <div class="md:col-6">
          <div class="form-field">
            <label for="lastName" class="form-label">Last name</label>
            <input type="text" class="form-control" id="lastName">
          </div>
        </div>

        <div class="md:col-6">
          <div class="form-field">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
          </div>
        </div>

        <div class="md:col-6">
          <div class="form-field">
            <label for="interest" class="form-label">I am interested in</label>
            <select class="form-control" id="interest">
              <option>Renting a garden plot</option>
              <option>Volunteering</option>
              <option>Getting a harvest box</option>
              <option>Other (Please specify)</option>

            </select>
          </div>
        </div>

        <div class="col-12">
          <div class="form-field">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5"></textarea>
          </div>
        </div>

        <div class="col-12">
          <div class="form-field">
            <input type="checkbox" class="check" id="consent">
            <label for="consent">I consent to be contacted</label>
          </div>
        </div>

      </div>
      <button type="submit" class="btn-solid theme-primary mt-5">Send message</button>
    </form>
  </main>

  <footer class="bg-primary fg-contrast-primary mt-5 py-4">
    <div class="container text-center">
      <p class="mb-0">© 2026 Greenroot Community Garden</p>
    </div>
  </footer>
</body>
</html>
